<!DOCTYPE html>
<html>
<head>
    <title>✈️ Upload History</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23229ED9'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle'%3E✈️%3C/text%3E%3C/svg%3E">
    <style>
        body { font-family:'Segoe UI',Tahoma,sans-serif; padding:15px; background:#f0f2f5; color:#333; }
        .card { background:#fff; padding:20px; border-radius:12px; box-shadow:0 8px 16px rgba(0,0,0,.05); max-width:640px; margin:auto; }
        .top-bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
        .top-bar h2 { margin:0; color:#1a73e8; font-size:20px; }
        .back-btn { background:none; border:1px solid #ccc; border-radius:6px; padding:8px 12px; cursor:pointer; font-weight:bold; color:#555; }
        .filters { display:flex; flex-direction:column; gap:8px; background:#f8f9fa; border:1px solid #e8eaed; border-radius:8px; padding:12px; margin-bottom:14px; }
        .filters input, .filters select { padding:10px; border:1px solid #ccc; border-radius:6px; font-size:13px; box-sizing:border-box; }
        .filter-row { display:flex; gap:8px; }
        .filter-row > * { flex:1; min-width:0; }
        .filter-actions { display:flex; gap:8px; }
        .btn { padding:10px; border:none; border-radius:6px; color:#fff; cursor:pointer; font-weight:bold; font-size:13px; }
        .btn-export { background:#0b8043; }
        .btn-clear { background:#5f6368; }
        ul { list-style:none; padding:0; margin:0; }
        li { background:#f8f9fa; border-bottom:1px solid #e8eaed; padding:10px; font-size:13px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
        li:last-child { border-bottom:none; }
        .fname { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:bold; display:block; }
        .time { font-size:11px; color:#80868b; }
        .msg-link { color:#1a73e8; text-decoration:none; font-weight:bold; font-size:12px; flex-shrink:0; }
        .row-actions { display:flex; gap:6px; flex-shrink:0; align-items:center; }
        .act { text-decoration:none; font-size:16px; padding:5px 9px; border-radius:6px; background:#f1f3f4; line-height:1; border:none; cursor:pointer; font-family:inherit; }
        .act.dl { background:#e6f4ea; }
        .act:active { opacity:.6; }
        .act:disabled { opacity:.5; cursor:progress; }
        #list-box { border:1px solid #e8eaed; border-radius:8px; overflow:hidden; min-height:80px; }
        #sentinel { text-align:center; padding:14px; font-size:12px; color:#888; }
        .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(26,115,232,.3);border-top-color:#1a73e8;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;}
        @keyframes sp{to{transform:rotate(360deg);}}
        .empty { text-align:center; color:#888; padding:30px; font-size:13px; }
        .meta { font-size:11px; color:#80868b; }
        .size-badge { font-size:11px; color:#5f6368; background:#eef1f4; border-radius:4px; padding:1px 6px; margin-left:6px; }
        .dur-badge { font-size:11px; color:#8a6d00; background:#fff3cd; border-radius:4px; padding:1px 6px; margin-left:6px; }
        #toast { position:fixed; bottom:-100px; left:50%; transform:translateX(-50%); color:#fff; padding:12px 24px; border-radius:8px; font-weight:bold; font-size:13px; z-index:9999; transition:bottom .4s; box-shadow:0 4px 12px rgba(0,0,0,.2); max-width:90%; text-align:center; }
    </style>
</head>
<body>
    <div id="toast">Notification</div>
    <div class="card">
        <div class="top-bar">
            <h2>📜 Upload History</h2>
            <button class="back-btn" onclick="location.href='/'">← Dashboard</button>
        </div>

        <div class="filters">
            <input type="text" id="f-query" placeholder="🔍 Search file name…">
            <div class="filter-row">
                <select id="f-ext"><option value="">All types</option></select>
                <select id="f-sort">
                    <option value="desc">Newest first</option>
                    <option value="asc">Oldest first</option>
                </select>
            </div>
            <div class="filter-row">
                <input type="date" id="f-from" title="From date">
                <input type="date" id="f-to" title="To date">
            </div>
            <div class="filter-actions">
                <button class="btn btn-export" onclick="exportCsv()">⬇️ Export CSV</button>
                <button class="btn btn-clear" onclick="clearFilters()">✖️ Clear Filters</button>
            </div>
        </div>

        <div id="list-box"><ul id="list"></ul><div id="sentinel"></div></div>
    </div>

<script>
let offset=0, loading=false, done=false, seq=0;

function params(){
    return new URLSearchParams({
        query: document.getElementById('f-query').value.trim(),
        ext: document.getElementById('f-ext').value,
        date_from: document.getElementById('f-from').value,
        date_to: document.getElementById('f-to').value,
        sort: document.getElementById('f-sort').value,
        limit: 20, offset,
    });
}

function resetAndLoad(){
    offset=0; done=false;
    document.getElementById('list').innerHTML='';
    loadMore();
}

async function loadMore(){
    if(loading||done) return;
    loading=true; const mySeq=++seq;
    document.getElementById('sentinel').innerHTML='<span class="spin"></span> Loading…';
    const res = await fetch('/api/history?'+params());
    const data = await res.json();
    if(mySeq!==seq) return; // a newer filter query superseded this one
    const ul=document.getElementById('list');
    if(offset===0 && data.length===0){
        ul.innerHTML = '<div class="empty">No uploads match these filters.</div>';
    } else {
        ul.insertAdjacentHTML('beforeend', data.map(f=>`
            <li><div style="min-width:0;"><span class="fname">📄 ${f.name}</span>
              <span class="meta">${f.time}${f.size?`<span class="size-badge">${fmtSize(f.size)}</span>`:''}${f.duration?`<span class="dur-badge">⏱️ ${fmtDur(f.duration)}</span>`:''}</span></div>
            <div class="row-actions">
              ${f.downloadable?`<button class="act dl" title="Download" onclick="doDownload('${f.hash}', this)">⬇️</button>`:''}
              ${f.link?`<a href="${f.link}" target="_blank" class="act" title="Open in Telegram">🔗</a>`:''}
            </div></li>`).join(''));
    }
    if(data.length<20){ done=true; document.getElementById('sentinel').innerText = offset+data.length>0 ? 'End of results.' : ''; }
    else { document.getElementById('sentinel').innerText=''; }
    offset += data.length;
    loading=false;
}

window.addEventListener('scroll', ()=>{
    if(window.innerHeight+window.scrollY >= document.body.offsetHeight-200) loadMore();
});

// <1MB → KB, <1GB → MB, else GB
function fmtSize(b){
    if(!b || b<=0) return '';
    const KB=1024, MB=1048576, GB=1073741824;
    if(b < MB) return (b/KB).toFixed(0)+' KB';
    if(b < GB) return (b/MB).toFixed(1)+' MB';
    return (b/GB).toFixed(2)+' GB';
}
function fmtDur(s){
    if(!s || s<=0) return '';
    s=Math.round(s);
    if(s<60) return s+'s';
    const m=Math.floor(s/60), sec=s%60;
    if(m<60) return m+'m '+sec+'s';
    const h=Math.floor(m/60); return h+'h '+(m%60)+'m';
}

let toastTimer;
function showToast(msg, danger=false){
    const t=document.getElementById('toast');
    t.innerText=msg; t.style.background=danger?'#d93025':'#1e8e3e'; t.style.bottom='24px';
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.bottom='-100px', 4000);
}

// Pre-check before download so failures show a toast instead of a raw JSON page.
async function doDownload(hash, btn){
    if(btn) btn.disabled = true;
    try{
        const r = await fetch(`/api/download/${hash}/check`);
        const j = await r.json();
        if(!r.ok) throw new Error(j.detail || 'Download failed');
        showToast('⬇️ Starting download…');
        window.location = `/api/download/${hash}`;   // browser streams it
    }catch(e){
        showToast('❌ '+e.message, true);
    }finally{
        setTimeout(()=>{ if(btn) btn.disabled=false; }, 800);
    }
}

function clearFilters(){
    document.getElementById('f-query').value='';
    document.getElementById('f-ext').value='';
    document.getElementById('f-from').value='';
    document.getElementById('f-to').value='';
    document.getElementById('f-sort').value='desc';
    resetAndLoad();
}
function exportCsv(){ window.open('/export.csv?'+params(), '_blank'); }

let searchTimer;
document.getElementById('f-query').addEventListener('input', ()=>{ clearTimeout(searchTimer); searchTimer=setTimeout(resetAndLoad,300); });
['f-ext','f-sort','f-from','f-to'].forEach(id=>document.getElementById(id).addEventListener('change', resetAndLoad));

fetch('/api/history/extensions').then(r=>r.json()).then(list=>{
    const sel=document.getElementById('f-ext');
    list.forEach(e=>{ const o=document.createElement('option'); o.value=e.ext; o.textContent=`.${e.ext} (${e.count})`; sel.appendChild(o); });
});

resetAndLoad();
</script>
</body>
</html>
