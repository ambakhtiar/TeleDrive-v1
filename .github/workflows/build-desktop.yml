# Build TeleDrive desktop launcher for Windows, macOS, and Linux.
# On push to main: uploads build artifacts (downloadable from Actions tab).
# On release: attaches binaries to the GitHub Release.
name: Build Desktop Launcher

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false    # build all OSes even if one fails
      matrix:
        include:
          - os: windows-latest
            artifact_name: TeleDrive-Windows.exe
            zip_name: TeleDrive-Windows.zip
          - os: macos-latest
            artifact_name: TeleDrive-macOS
            zip_name: TeleDrive-macOS.zip
          - os: ubuntu-latest
            artifact_name: TeleDrive-Linux
            zip_name: TeleDrive-Linux.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libffi-dev libssl-dev

      - name: Install Python dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt pyinstaller

      - name: Install Python dependencies (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python -m pip install --upgrade pip wheel setuptools
          # Skip cryptg (Windows-only AES speedup) and use plain uvicorn
          pip install \
            fastapi==0.111.0 uvicorn==0.30.1 telethon==1.36.0 \
            python-dotenv==1.0.1 pydantic==2.11.7 python-multipart==0.0.9 \
            Pillow==11.3.0 cryptography==43.0.1 \
            pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller desktop/launcher.spec

      - name: Prepare artifact
        shell: bash
        run: |
          cd dist
          if [ -d "TeleDrive" ]; then
            zip -r "../${{ matrix.zip_name }}" TeleDrive/
          fi
          cd ..

      - name: Upload artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip_name }}
          path: ${{ matrix.zip_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Attach to Release (on release only)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.zip_name }}
