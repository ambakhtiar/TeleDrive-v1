# Build TeleDrive desktop launcher for Windows, macOS, and Linux.
# On push to main: uploads build artifacts (downloadable from Actions tab).
# On release: attaches binaries to the GitHub Release.
name: Build Desktop Launcher

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: TeleDrive-Windows.exe
            zip_name: TeleDrive-Windows.zip
          - os: macos-latest
            artifact_name: TeleDrive-macOS
            zip_name: TeleDrive-macOS.zip
          - os: ubuntu-latest
            artifact_name: TeleDrive-Linux
            zip_name: TeleDrive-Linux.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # ── Python + Tk, per OS ──────────────────────────────────────────────
      # actions/setup-python's macOS builds are a known case where _tkinter
      # is not compiled in at all (tracked upstream in actions/setup-python;
      # no amount of `brew install python-tk` fixes it, because that installs
      # Tk for Homebrew's OWN separate Python, not the one setup-python put on
      # PATH). Even where a plain `import tkinter` happens to succeed,
      # PyInstaller's Analysis-time Tcl/Tk hook does deeper introspection
      # (locating tcl_library/tk_library on disk to bundle them) that can
      # still fail on a mismatched interpreter/Tk pairing — which is exactly
      # "succeeds at the tkinter-import check, fails later in the PyInstaller
      # step" seen here on both macOS and Linux.
      #
      # Fix: don't fight PATH ordering — install Python and its matching Tk
      # from the SAME provider (Homebrew on macOS, apt's system Python on
      # Linux) so they're guaranteed to be linked against each other, and
      # reference that one interpreter explicitly via $PYTHON_BIN for every
      # later step. Windows keeps actions/setup-python, whose Windows builds
      # bundle Tcl/Tk correctly already (this is the one platform that's
      # been passing).

      - name: Set up Python 3.11 (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Python + Tk (macOS)
        if: runner.os == 'macOS'
        run: |
          # Don't take whatever "latest" Homebrew's unversioned python-tk
          # pulls in — confirmed root cause of a prior failure here: Homebrew
          # had already moved its default to Python 3.14, and pydantic-core
          # (a Rust/PyO3 extension with no prebuilt wheel for that new ABI
          # yet) failed to build from source because PyO3 0.24.1 only
          # supports up to 3.13. Pin to an already-widely-supported minor
          # version instead, with older fallbacks in case Homebrew ages one
          # out before this workflow is revisited.
          PYFORMULA=""
          for V in 3.12 3.13 3.11; do
            if brew install "python-tk@$V"; then
              PYFORMULA="python@$V"
              break
            fi
          done
          if [ -z "$PYFORMULA" ]; then
            echo "::error::Could not install python-tk for any of 3.12/3.13/3.11"
            exit 1
          fi
          BASE_PY="$(brew --prefix "$PYFORMULA")/bin/python3"
          "$BASE_PY" --version
          # Homebrew's Python is PEP 668 "externally managed" — plain pip
          # install is refused. A venv inherits the base interpreter's
          # compiled stdlib (tkinter included) without recompiling anything,
          # so this keeps the Tk fix above while sidestepping that guard
          # properly instead of forcing past it with --break-system-packages.
          "$BASE_PY" -m venv "$HOME/build-venv"
          echo "PYTHON_BIN=$HOME/build-venv/bin/python3" >> "$GITHUB_ENV"
          "$HOME/build-venv/bin/python3" --version

      - name: Set up Python + Tk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libffi-dev libssl-dev python3 python3-venv python3-pip python3-tk tk-dev
          python3 -m venv "$HOME/build-venv"
          echo "PYTHON_BIN=$HOME/build-venv/bin/python3" >> "$GITHUB_ENV"
          "$HOME/build-venv/bin/python3" --version

      - name: Set PYTHON_BIN (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "PYTHON_BIN=python" >> "$GITHUB_ENV"

      # ── Python packages ─────────────────────────────────────────────────
      # cryptg is Windows-only; uvicorn[standard] extras can fail on macOS.
      # Install platform-specific sets to avoid build failures. Every install
      # and the build itself go through the SAME $PYTHON_BIN chosen above.

      - name: Install Python dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          "$PYTHON_BIN" -m pip install --upgrade pip wheel setuptools
          "$PYTHON_BIN" -m pip install -r requirements.txt pyinstaller

      - name: Install Python dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          "$PYTHON_BIN" -m pip install --upgrade pip wheel setuptools
          "$PYTHON_BIN" -m pip install \
            fastapi==0.111.0 uvicorn==0.30.1 telethon==1.36.0 \
            python-dotenv==1.0.1 pydantic==2.11.7 python-multipart==0.0.9 \
            Pillow==11.3.0 cryptography==43.0.1 \
            pyinstaller

      - name: Install Python dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          "$PYTHON_BIN" -m pip install --upgrade pip wheel setuptools
          "$PYTHON_BIN" -m pip install \
            fastapi==0.111.0 uvicorn==0.30.1 telethon==1.36.0 \
            python-dotenv==1.0.1 pydantic==2.11.7 python-multipart==0.0.9 \
            Pillow==11.3.0 cryptography==43.0.1 \
            pyinstaller

      # ── Debug: check tkinter availability AND that PyInstaller's own
      # hook can resolve real Tcl/Tk library paths (the deeper check that a
      # plain import can miss) ───────────────────────────────────────────

      - name: Verify tkinter is importable
        shell: bash
        run: |
          "$PYTHON_BIN" -c "
          import tkinter
          r = tkinter.Tcl()
          print('tkinter OK:', tkinter.TkVersion)
          print('tcl_library:', r.eval('info library'))
          "

      # ── Build ───────────────────────────────────────────────────────────

      - name: Build with PyInstaller
        shell: bash
        run: |
          "$PYTHON_BIN" -m PyInstaller --log-level WARN desktop/launcher.spec 2>&1 | tail -200

      # ── Package (use Python zipfile — works everywhere) ─────────────────

      - name: Zip the bundle
        shell: bash
        run: |
          "$PYTHON_BIN" -c "
          import os, zipfile
          dist = 'dist'
          zip_name = '${{ matrix.zip_name }}'
          with zipfile.ZipFile(zip_name, 'w', zipfile.ZIP_DEFLATED) as zf:
              for root, dirs, files in os.walk(os.path.join(dist, 'TeleDrive')):
                  for f in files:
                      full = os.path.join(root, f)
                      arc = os.path.relpath(full, dist)
                      zf.write(full, arc)
          size_mb = os.path.getsize(zip_name) / (1024 * 1024)
          print(f'Created {zip_name} ({size_mb:.1f} MB)')
          "

      # ── Upload ──────────────────────────────────────────────────────────

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip_name }}
          path: ${{ matrix.zip_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Attach to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.zip_name }}
