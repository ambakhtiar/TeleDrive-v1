# Build TeleDrive desktop launcher for Windows, macOS, and Linux.
# On push to main: uploads build artifacts (downloadable from Actions tab).
# On release: attaches binaries to the GitHub Release.
name: Build Desktop Launcher

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: TeleDrive-Windows.exe
            zip_name: TeleDrive-Windows.zip
          - os: macos-latest
            artifact_name: TeleDrive-macOS
            zip_name: TeleDrive-macOS.zip
          - os: ubuntu-latest
            artifact_name: TeleDrive-Linux
            zip_name: TeleDrive-Linux.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── System dependencies per OS ──────────────────────────────────────

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libffi-dev libssl-dev python3-tk tk-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install python-tk@3.11 || brew install python-tk || true

      # ── Python packages ─────────────────────────────────────────────────
      # cryptg is Windows-only; uvicorn[standard] extras can fail on macOS.
      # Install platform-specific sets to avoid build failures.

      - name: Install Python dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt pyinstaller

      - name: Install Python dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install \
            fastapi==0.111.0 uvicorn==0.30.1 telethon==1.36.0 \
            python-dotenv==1.0.1 pydantic==2.11.7 python-multipart==0.0.9 \
            Pillow==11.3.0 cryptography==43.0.1 \
            pyinstaller

      - name: Install Python dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install \
            fastapi==0.111.0 uvicorn==0.30.1 telethon==1.36.0 \
            python-dotenv==1.0.1 pydantic==2.11.7 python-multipart==0.0.9 \
            Pillow==11.3.0 cryptography==43.0.1 \
            pyinstaller

      # ── Debug: check tkinter availability ───────────────────────────────

      - name: Verify tkinter is importable
        shell: python
        run: |
          import tkinter
          print(f"tkinter OK: {tkinter.TkVersion}")

      # ── Build ───────────────────────────────────────────────────────────

      - name: Build with PyInstaller
        shell: bash
        run: pyinstaller --log-level WARN desktop/launcher.spec 2>&1 | tail -80

      # ── Package (use Python zipfile — works everywhere) ─────────────────

      - name: Zip the bundle
        shell: python
        run: |
          import os, zipfile
          dist = "dist"
          zip_name = "${{ matrix.zip_name }}"
          with zipfile.ZipFile(zip_name, "w", zipfile.ZIP_DEFLATED) as zf:
              for root, dirs, files in os.walk(os.path.join(dist, "TeleDrive")):
                  for f in files:
                      full = os.path.join(root, f)
                      arc = os.path.relpath(full, dist)
                      zf.write(full, arc)
          size_mb = os.path.getsize(zip_name) / (1024 * 1024)
          print(f"Created {zip_name} ({size_mb:.1f} MB)")

      # ── Upload ──────────────────────────────────────────────────────────

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip_name }}
          path: ${{ matrix.zip_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Attach to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.zip_name }}
