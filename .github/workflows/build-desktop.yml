# Build TeleDrive desktop launcher for Windows, macOS, and Linux.
# On push to main: uploads build artifacts (downloadable from Actions tab).
# On release: attaches binaries to the GitHub Release.
name: Build Desktop Launcher

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: TeleDrive-Windows.exe
            zip_name: TeleDrive-Windows.zip
          - os: macos-latest
            artifact_name: TeleDrive-macOS
            zip_name: TeleDrive-macOS.zip
          - os: ubuntu-latest
            artifact_name: TeleDrive-Linux
            zip_name: TeleDrive-Linux.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libffi-dev libssl-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller desktop/launcher.spec

      - name: Zip the bundle (Linux/macOS) or prepare exe (Windows)
        shell: bash
        run: |
          cd dist
          if [ -d "TeleDrive" ]; then
            zip -r "../${{ matrix.zip_name }}" TeleDrive/
          fi
          cd ..

      - name: Upload artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip_name }}
          path: |
            dist/${{ matrix.zip_name }}
            dist/TeleDrive/${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Attach to Release (on release only)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.zip_name }}
            dist/TeleDrive/${{ matrix.artifact_name }}
